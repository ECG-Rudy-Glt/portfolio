<svg viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'SF Mono', Menlo, monospace" role="img" aria-label="Home Assistant dans une machine virtuelle du serveur 1, avec deux clés radio USB (Zigbee et Thread), une puce Bluetooth pour l'appairage et le Wi-Fi de la box">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0a868"/></marker>
  </defs>
  <rect width="1200" height="620" fill="#14100c"/>
  <text x="40" y="34" fill="#ad9a85" font-size="13" letter-spacing="2">SERVEUR 1 (Proxmox)</text>
  <rect x="30" y="46" width="470" height="540" rx="12" fill="none" stroke="#2f261d" stroke-dasharray="6 6"/>
  <rect x="60" y="70" width="410" height="120" rx="8" fill="#1e1712" stroke="#2f261d"/>
  <text x="265" y="106" fill="#f0e6d8" font-size="17" text-anchor="middle">VM Home Assistant</text>
  <text x="265" y="132" fill="#ad9a85" font-size="12.5" text-anchor="middle">ZHA · Matter Server · OpenThread Border Router</text>
  <text x="265" y="154" fill="#ad9a85" font-size="12.5" text-anchor="middle">automatisations, scripts, tableaux</text>
  <text x="265" y="176" fill="#ad9a85" font-size="12.5" text-anchor="middle">62 automatisations · 14 scripts</text>

  <g font-size="14" text-anchor="middle">
    <rect x="60" y="290" width="410" height="52" rx="8" fill="#1e1712" stroke="#d9a521"/><text x="265" y="312" fill="#f0e6d8">Clé USB Zigbee</text><text x="265" y="331" fill="#ad9a85" font-size="12">transmise à la VM par port USB · canal 11</text>
    <rect x="60" y="370" width="410" height="52" rx="8" fill="#1e1712" stroke="#3f9b74"/><text x="265" y="392" fill="#f0e6d8">Clé USB Thread (firmware OpenThread)</text><text x="265" y="411" fill="#ad9a85" font-size="12">transmise à la VM par port USB · canal 15</text>
    <rect x="60" y="450" width="410" height="52" rx="8" fill="#1e1712" stroke="#4f8ac4"/><text x="265" y="472" fill="#f0e6d8">Bluetooth de la carte du serveur</text><text x="265" y="491" fill="#ad9a85" font-size="12">sert au seul appairage des appareils Matter</text>
  </g>
  <line x1="265" y1="190" x2="265" y2="288" stroke="#e0a868" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="285" y="246" fill="#ad9a85" font-size="12">USB</text>

  <g font-size="14">
    <text x="660" y="316" fill="#d9a521" font-size="13" letter-spacing="2">RÉSEAU ZIGBEE</text>
    <text x="660" y="340" fill="#f0e6d8">5 lampes</text><text x="660" y="360" fill="#ad9a85" font-size="12">réseau maillé, chaque lampe relaie</text>
    <text x="660" y="396" fill="#3f9b74" font-size="13" letter-spacing="2">MATTER SUR THREAD</text>
    <text x="660" y="420" fill="#f0e6d8">2 prises (routeurs, toujours alimentées)</text>
    <text x="660" y="440" fill="#f0e6d8">bouton double + molette, capteur de température</text><text x="660" y="460" fill="#ad9a85" font-size="12">les appareils à piles passent par les prises</text>
  </g>
  <path d="M470 316 H640" stroke="#d9a521" stroke-width="2" stroke-dasharray="3 6" stroke-linecap="round"/>
  <path d="M470 396 H640" stroke="#3f9b74" stroke-width="2" stroke-dasharray="3 6" stroke-linecap="round"/>

  <text x="660" y="106" fill="#ad9a85" font-size="13" letter-spacing="2">WI-FI DE LA BOX</text>
  <g font-size="14" fill="#f0e6d8"><text x="660" y="132">TV (Google Cast)</text><text x="660" y="154">purificateur d'air</text><text x="660" y="176">caméra</text><text x="660" y="198">téléphones (présence, notifications)</text></g>
  <text x="660" y="226" fill="#ad9a85" font-size="12">intégrations par le réseau, pas par radio dédiée</text>
  <path d="M470 130 H640" stroke="#8a6bc4" stroke-width="2" stroke-dasharray="3 6" stroke-linecap="round"/>
  <text x="40" y="606" fill="#ad9a85" font-size="12">Zigbee (canal 11) et Thread (canal 15) sont volontairement éloignés pour limiter les interférences sur 2,4 GHz.</text>
</svg>
