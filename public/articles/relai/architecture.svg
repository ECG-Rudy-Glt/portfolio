<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1148" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<title id="t">Architecture de Relai</title>
<desc id="d">Un dépôt (AGENTS.md, relai.yaml, notes, openspec, Beads ou GitHub Issues, historique git) est lu par le binaire relai. Il produit le handoff au démarrage de session et le guide pour l'agent. Trois couches facultatives : plusieurs dépôts (index, find, workspace, discover), conventions partagées (hub, sync, check en CI) et le serveur Relai-Team joint en MCP.</desc>
