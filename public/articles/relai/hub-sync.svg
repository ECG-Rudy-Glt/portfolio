<text x="260.0" y="502.4" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="700">Fichier modifié à la main : code de sortie 1</text>
<text x="260.0" y="521.4" text-anchor="middle" font-size="14" fill="#ffffff">--outdated : prévient d'un tag plus récent</text>
</svg>
