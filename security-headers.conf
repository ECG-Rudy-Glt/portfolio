# En-têtes de sécurité, inclus dans chaque location (un add_header dans une location
# annule ceux du niveau supérieur). Les scripts et styles en ligne d'Astro imposent 'unsafe-inline'.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' https://homelab.gault-rudy.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
