# Compteur de pages vues sans cookie ni donnée personnelle : une ligne « x » par page HTML chargée,
# hors robots et hors outils en ligne de commande. Aucune adresse IP, aucun identifiant n'est enregistré.
map $http_user_agent $is_bot {
    default 0;
    "~*(bot|crawl|spider|slurp|curl|wget|python|go-http|monitor|uptime|headless|preview|facebookexternalhit|lighthouse)" 1;
    "" 1;
}
map "$request_method:$request_uri:$is_bot" $count_view {
    default 0;
    "~^GET:/[^.?:]*(\?[^:]*)?:0$" 1;
}
log_format counter 'x';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    server_tokens off;
    include /etc/nginx/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml;

    access_log /data/hits.log counter if=$count_view;

    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ $uri/index.html =404;
    }

    # anciennes pages supprimées (modes d'affichage, minimal) : retour à l'accueil, sans compter de vue
    location ~ ^/(modes|minimal)(/(index\.html)?)?$ {
        access_log off;
        include /etc/nginx/security-headers.conf;
        return 301 /;
    }

    # total mis à jour par docker-entrypoint.d/40-counter.sh
    location = /stats.json {
        alias /tmp/stats.json;
        default_type application/json;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store";
    }

    error_page 404 /404.html;
    location = /404.html { internal; include /etc/nginx/security-headers.conf; }

    # le CV change : cache court, pour que Cloudflare et les navigateurs reprennent vite la nouvelle version
    location ~* \.pdf$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=300";
    }

    location ~* \.(?:css|js|svg|woff2?)$ {
        expires 30d;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, immutable";
    }
}
