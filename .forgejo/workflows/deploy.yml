name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  build-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        run: |
          if [ -d .git ]; then
            git fetch origin main && git reset --hard origin/main
          else
            git clone https://forgejo.home.lab.rudy/rudy/portfolio.git .
          fi

      - name: Login to Forgejo registry
        run: |
          echo "${{ secrets.FORGEJO_REGISTRY_TOKEN }}" | \
            docker login forgejo.home.lab.rudy -u rudy --password-stdin

      - name: Build & push image
        run: |
          IMAGE=forgejo.home.lab.rudy/rudy/portfolio
          docker build -t "${IMAGE}:${{ github.sha }}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"

      - name: Deploy to lxc-portfolio
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 600 /dev/null /tmp/deploy_key
          echo "$DEPLOY_KEY" > /tmp/deploy_key
          ssh -i /tmp/deploy_key \
              -o StrictHostKeyChecking=no \
              root@10.0.20.15 "
            docker pull forgejo.home.lab.rudy/rudy/portfolio:latest &&
            docker stop portfolio 2>/dev/null || true &&
            docker rm   portfolio 2>/dev/null || true &&
            docker run -d \
              --name portfolio \
              --restart unless-stopped \
              -p 80:80 \
              forgejo.home.lab.rudy/rudy/portfolio:latest
          "
          rm -f /tmp/deploy_key
